name: ECG Axis Calculator CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and optional API dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.30,<1" "pydantic>=2,<3" "pytest>=8,<10"
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q ecg_axis.py cli.py agents enrichment.py simulator.py
      - name: Run regression tests
        run: python -m pytest -q

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax validation
        run: node --check web/calculator.js
      - name: Test browser calculation engine and CSV workflow
        run: node --test web/calculator.test.cjs
      - name: Validate browser entry point
        run: |
          test -f web/index.html
          grep -q 'src="./calculator.js"' web/index.html
          ! grep -q "fetch('/api/audit'" web/index.html

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag ecg-axis-calculator:test .
      - name: Smoke-test container health
        run: |
          docker run -d --name ecg-test -p 127.0.0.1:18000:8000 ecg-axis-calculator:test
          trap 'docker logs ecg-test; docker rm -f ecg-test' EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:18000/health; then exit 0; fi
            sleep 2
          done
          exit 1
