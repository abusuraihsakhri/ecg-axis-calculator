name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload standalone static web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML and JavaScript
        run: |
          set -euo pipefail
          site="${{ steps.deployment.outputs.page_url }}"
          test -n "$site"
          for attempt in $(seq 1 15); do
            if curl --fail --location --silent --show-error --max-time 12 "$site" -o /tmp/ecg-page.html \
              && curl --fail --location --silent --show-error --max-time 12 "${site%/}/calculator.js" -o /tmp/ecg-calculator.js \
              && grep -q 'id="pair-form"' /tmp/ecg-page.html \
              && grep -q 'function pair(' /tmp/ecg-calculator.js; then
              node --check /tmp/ecg-calculator.js
              echo "Published site and JavaScript asset verified: $site"
              exit 0
            fi
            sleep 5
          done
          echo "Live GitHub Pages HTTP smoke test failed" >&2
          exit 1
